services:
  backend:
    build: ./backend
    # No publica el puerto en el host.
    # nginx del frontend actúa como proxy inverso hacia backend:8000 dentro de la misma
    # red de Docker, por lo que no hace falta acceso directo desde el exterior.
    # (Si se publicara, también aparecería el puerto 8000 en la lista de puertos del Codespace, lo que puede causar confusión).
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
