server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: si no hay un archivo estático, utiliza index.html como alternativa
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia backend
    # El navegador siempre puede enviar las peticiones al mismo origen desde el que se accede,
    # sin tener que fijar el nombre de host o el puerto de backend en el frontend
    location /app/api {
        proxy_pass http://backend:8000/app/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
